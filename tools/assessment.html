*{box-sizing:border-box;margin:0;padding:0}

.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 4px}
.bar i{display:block;height:6px;background:var(--acc);border-radius:3px;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.q{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:8px}
.q .t{font-weight:600}
textarea,input[type=text],input[type=number]{width:100%;background:#0f151c;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:8px;font-size:15px;margin-top:6px}
textarea{min-height:90px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
label{color:var(--dim);font-size:14px}
input[type=text]{max-width:160px}
.btn{background:var(--acc);color:#04121f;border:none;border-radius:8px;padding:9px 18px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx);font-weight:400}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;margin-top:22px}
.seg button{background:none;border:1px solid var(--line);color:var(--tx);padding:6px 12px;border-radius:6px;cursor:pointer;margin:2px;font-size:14px}
.seg button.on{background:var(--acc);color:#04121f;border-color:var(--acc)}
.hint{color:var(--dim);font-size:14px}
.ans{background:#101820;border-left:3px solid var(--acc);padding:10px 12px;border-radius:6px;margin-top:8px;font-size:14px;display:none}
.ans.show{display:block}
.good{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{color:var(--dim);font-weight:500}
canvas{display:block;margin:10px auto;background:#10161d;border-radius:10px}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:13px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
.small{font-size:13px;color:var(--dim)}
@media(max-width:600px){h1{font-size:15px}}
</style>
</head>

weekly:["Spot biases in 2 decision scenarios (cheat sheet in docs/04)","Do one calibration set in the Gym (rotate sets B–H)","Write one 'how am I thinking right now' metacognition note","45-min deep-thinking worksheet (docs/04)","One steelman drill: state the strongest counter-view (docs/04)","Check predictions one by one; review the most painful miss"]}};
function plan12(){const t=T[lang],d=R.dims;
const order=d.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]);
const w1=order[0][1],w2=order[1][1];
return {focus:[`${t.dims[w1]} (${d[w1]}%)`,`${t.dims[w2]} (${d[w2]}%)`],
daily:[ACT[lang].daily[w1],ACT[lang].daily[w2]],
weekly:[ACT[lang].weekly[w1],ACT[lang].weekly[w2]],
c7:C7D.map(x=>(lang=='zh'?x.zh:x.en)+'：'+(lang=='zh'?x.gz:x.ge)),
miles:[t.w12,t.w34,t.w56,t.w78,t.w912],
rule:lang=='zh'?"只修这 1–2 个维度，坚持 4 周再评估；第 1–2 周只做最小动作。":"Fix only these 1–2 dimensions for 4 weeks; weeks 1–2 minimum actions only."};}
function radarOn(ctx,cx,cy,r,vals,labels,font){ctx.strokeStyle='#2b3540';ctx.fillStyle='#93a1b0';ctx.font=font||'12px sans-serif';
for(const g of[0.25,0.5,0.75,1]){ctx.beginPath();for(let i=0;i<=6;i++){const a=Math.PI*2*i/6-Math.PI/2;
ctx[i?'lineTo':'moveTo'](cx+r*g*Math.cos(a),cy+r*g*Math.sin(a));}ctx.stroke();}
ctx.beginPath();vals.forEach((v,i)=>{const a=Math.PI*2*i/6-Math.PI/2,rr=r*v/100;
ctx[i?'lineTo':'moveTo'](cx+rr*Math.cos(a),cy+rr*Math.sin(a));});ctx.closePath();
ctx.fillStyle='rgba(77,163,255,.25)';ctx.fill();ctx.strokeStyle='#4da3ff';ctx.stroke();
labels.forEach((lb,i)=>{const a=Math.PI*2*i/6-Math.PI/2;ctx.textAlign=Math.abs(Math.cos(a))<0.3?'center':(Math.cos(a)>0?'left':'right');ctx.textBaseline='middle';
ctx.fillText(`${lb} ${vals[i]}%`,cx+(r+24)*Math.cos(a),cy+(r+24)*Math.sin(a));});}
function radar(cv,vals,labels){const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
radarOn(ctx,cv.width/2,cv.height/2,Math.min(cv.width,cv.height)/2-46,vals,labels);}
function renderReport(){const t=T[lang],a=$('app');if(!R)grade();saveHist();
const p=plan12();
a.innerHTML=`<h2>${t.score}</h2>

<table><tr><th></th>${t.dims.map(d=>`<th>${d}</th>`).join('')}</tr>
<tr><td>%</td>${R.dims.map(v=>`<td class="${v<50?'bad':v>=75?'good':''}">${v}% <span class="small">${lv(v)}</span></td>`).join('')}</tr>
<tr><td class="small">${lang=='zh'?'测什么':'Measures'}</td>${t.dimHow.map(x=>`<td class="small" style="font-size:11px">${x}</td>`).join('')}</tr></table>
<p class="small">📊 ${t.refNote}</p>
<p class="small">🔁 ${t.retestNote}</p>
<div id="cmp"></div>
<h2>${t.diagT}</h2><div class="card">${diagnosis().map(d=>`<p>• ${d}</p>`).join('')}</div>
<h2>${lang=='zh'?'C 实战七项':'Part C · seven structures'}</h2><div class="card">
<table><tr>${C7D.map(d=>`<th style="font-size:11px">${lang=='zh'?d.zh:d.en}</th>`).join('')}</tr>
<tr>${R.scores.c.map((v,i)=>`<td class="${v<=1?'bad':''}" style="text-align:center">${v}/3</td>`).join('')}</tr></table>
<p class="small">💡 ${(()=>{const wi=R.scores.c.indexOf(Math.min(...R.scores.c));return (lang=='zh'?'最弱项 ':'Weakest ')+(lang=='zh'?C7D[wi].zh:C7D[wi].en)+' — '+(lang=='zh'?C7D[wi].gz:C7D[wi].ge)})()}</p></div>
<h2>${t.plan12}</h2><div class="card">
<p><b>${lang=='zh'?'重点维度':'Focus'}：</b>${p.focus.join(' · ')}</p>
<p><b>${t.daily}</b></p><ul>${p.daily.map(x=>`<li>${x}</li>`).join('')}</ul>
<p><b>${t.weekly}</b></p><ul>${p.weekly.map(x=>`<li>${x}</li>`).join('')}</ul>
<p><b>${lang=='zh'?'七项结构（在每周深度思考时练习）':'Seven structures (practice in weekly deep-thinking)'}</b></p><ul>${p.c7.map(x=>`<li class="small">${x}</li>`).join('')}</ul>
<p><b>${t.miles}</b></p><ul>${p.miles.map(x=>`<li>${x}</li>`).join('')}</ul>
<p class="small">${p.rule} ${lang=='zh'?'延伸材料：':'Extras: '}<a href="../docs/03-训练系统.md" style="color:#4da3ff">${lang=='zh'?'12 周训练系统':'12-week system'}</a> · <a href="../docs/04-模板库.md" style="color:#4da3ff">${lang=='zh'?'模板库':'templates'}</a> · <a href="../docs/05-参考文献.md" style="color:#4da3ff">${lang=='zh'?'参考文献':'references'}</a></p>
<p><a class="btn ghost" style="display:inline-block;text-decoration:none" href="training.html">${t.gym} →</a></p></div>
<div class="card"><b>${t.histT}</b><div id="hist"></div></div>
<p class="hint">${t.reportTip}</p>
<div class="row"><button class="btn" onclick="dlPNG()">${t.img}</button>
<button class="btn ghost" onclick="copyShare(this)">${t.copy}</button>
<button class="btn ghost" onclick="dlJSON()">${t.export}</button>
<button class="btn ghost" onclick="dlMD()">${t.md}</button>
<button class="btn ghost" onclick="$('fi').click()">${t.import}</button>
<input type="file" id="fi" accept=".json" style="display:none" onchange="cmpJSON(this)"></div>`;
radar($('cv'),R.dims,t.dims);renderHist();}
/* ---------- export / compare ---------- */
function dlJSON(){const b=new Blob([JSON.stringify(R,null,1)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`thinking-assessment-${R.date}.json`;a.click();}
function mdReport(){const t=T[lang],s=R.scores,p=plan12();
return `# ${t.title} — Report\n\nDate: ${R.date}\n\n## ${t.score}\n\n| | ${t.dims.join(' | ')} |\n|---|${t.dims.map(()=>'---').join('|')}|\n| % | ${R.dims.join('% | ')}% |\n\n`+
`- A1: ${s.a1sum}/4 (gut-corrected: ${s.a1corrSum})\n- A2: ${s.a2sum.toFixed(2)}/6\n- A3: ${s.a3sum}/4\n- A4 hits: ${s.a4hits}/10\n- C: ${s.csum}/21 (${R.scores.c.join('/3, ')}/3)\n\n## ${t.diagT}\n\n${diagnosis().map(d=>'- '+d).join('\n')}\n\n## ${t.plan12}\n\n${lang=='zh'?'重点维度':'Focus'}: ${p.focus.join(' · ')}\n\n${t.daily}:\n${p.daily.map(x=>'- '+x).join('\n')}\n\n${t.weekly}:\n${p.weekly.map(x=>'- '+x).join('\n')}\n\n${lang=='zh'?'七项结构':'Seven structures'}:\n${p.c7.map(x=>'- '+x).join('\n')}\n\n${t.miles}:\n${p.miles.map(x=>'- '+x).join('\n')}\n\n> ${p.rule}\n`;}
/* ---------- history (localStorage) ---------- */
function histGet(){try{return JSON.parse(localStorage.getItem('ta_history'))||[]}catch(e){return[]}}
function saveHist(){const h=histGet(),last=h[h.length-1];
if(last&&last.date==R.date&&JSON.stringify(last.dims)==JSON.stringify(R.dims))return;
h.push({date:R.date,dims:R.dims.slice()});try{localStorage.setItem('ta_history',JSON.stringify(h.slice(-20)))}catch(e){}}
function renderHist(){const t=T[lang],h=histGet(),el=$('hist');if(!el)return;
if(h.length<=1){el.innerHTML=`<p class="small">${t.histNone}</p><p class="small">${t.histNote}</p>`;return;}
const prev=h[h.length-2];
el.innerHTML=`<table><tr><th>${lang=='zh'?'日期':'Date'}</th>${t.dims.map(d=>`<th>${d}</th>`).join('')}</tr>`+
h.slice(-5).map(x=>`<tr><td>${x.date}</td>${x.dims.map(v=>`<td>${v}%</td>`).join('')}</tr>`).join('')+`</table>
<p class="small"><b>${lang=='zh'?'上次→本次':'Last→now'}：</b>${R.dims.map((v,j)=>{const d=v-prev.dims[j];return `${t.dims[j]} ${d>0?'+':''}${d}`;}).join(' · ')}</p>
<p class="small">${t.histNote}</p>`;}
/* ---------- long image & share ---------- */
function wrapTxt(ctx,txt,x,y,maxW,lh,draw){let line='';
for(const ch of String(txt)){if(ctx.measureText(line+ch).width>maxW){if(draw)ctx.fillText(line,x,y);y+=lh;line=ch;}else line+=ch;}
if(line){if(draw)ctx.fillText(line,x,y);y+=lh;}return y;}
function secH(ctx,arr,maxW,lh){return arr.reduce((h,s)=>h+wrapTxt(ctx,s,0,0,maxW,lh,false),0);}
function dlPNG(){const t=T[lang],p=plan12(),diag=diagnosis();
const W=750,M=40,maxW=W-2*M,lh=30;
const cv=document.createElement('canvas');const ctx=cv.getContext('2d');ctx.font='15px sans-serif';
const planLines=[`${lang=='zh'?'重点维度':'Focus'}: ${p.focus.join(' · ')}`,t.daily+'：',...p.daily,t.weekly+'：',...p.weekly,`${lang=='zh'?'七项结构（每周深度思考）':'Seven structures'}:`,...p.c7,t.miles+'：',...p.miles,p.rule];
/* 前缀计入测量，保证测量行数与绘制完全一致（此前测量未加前缀，长文时绘制多行导致底部截断） */
const diagP=diag.map(x=>'• '+x),planP=planLines.map(x=>'· '+x);
const H=90+440+28+6*36+22+26+secH(ctx,diagP,maxW-16,lh)+20+26+secH(ctx,planP,maxW-16,lh)+16+24;
cv.width=W;cv.height=H;
ctx.fillStyle='#0f1419';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#e8edf2';ctx.textAlign='left';ctx.textBaseline='alphabetic';
ctx.font='bold 26px sans-serif';ctx.fillText(t.title,M,52);
ctx.font='14px sans-serif';ctx.fillStyle='#93a1b0';ctx.fillText(`${R.date} · thinking-assessment`,M,76);
radarOn(ctx,W/2,90+220,150,R.dims,t.dims,'14px sans-serif');
ctx.textAlign='left';ctx.textBaseline='alphabetic'; /* 复位：radarOn 内部按角度设置 textAlign/textBaseline，不复位会导致后续所有文字错位 */
let y=90+440;
ctx.font='bold 18px sans-serif';ctx.fillStyle='#e8edf2';ctx.fillText(t.score,M,y);y+=28;
ctx.font='15px sans-serif';
R.dims.forEach((v,i)=>{ctx.fillStyle='#93a1b0';ctx.fillText(t.dims[i],M,y);
ctx.fillStyle='#2b3540';ctx.fillRect(M+180,y-12,380,14);
ctx.fillStyle=v<50?'#e05d5d':v>=75?'#3fb96f':'#4da3ff';ctx.fillRect(M+180,y-12,380*v/100,14);
ctx.fillStyle='#e8edf2';ctx.fillText(v+'%',M+575,y);y+=36;});
y+=22;ctx.font='bold 18px sans-serif';ctx.fillText(t.diagT,M,y);y+=26;ctx.font='15px sans-serif';ctx.fillStyle='#c9d4de';
diagP.forEach(d=>{y=wrapTxt(ctx,d,M,y,maxW-16,lh,true);});
y+=20;ctx.font='bold 18px sans-serif';ctx.fillStyle='#e8edf2';ctx.fillText(t.plan12,M,y);y+=26;ctx.font='15px sans-serif';ctx.fillStyle='#c9d4de';
planP.forEach(s=>{y=wrapTxt(ctx,s,M,y,maxW-16,lh,true);});
y+=16;ctx.fillStyle='#93a1b0';ctx.font='13px sans-serif';
ctx.fillText(lang=='zh'?'思考能力评估与重建 · 全自动本地评估，无后端、不收集数据':'Thinking Assessment & Reconstruction · fully local, no backend, no data',M,y);
cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`thinking-assessment-${R.date}.png`;a.click();},'image/png');}
function copyShare(btn){const t=T[lang],p=plan12();
const txt=`${t.title} · ${lang=='zh'?'我的思考画像':'my thinking profile'} (${R.date})\n`+t.dims.map((d,i)=>`${d} ${R.dims[i]}%`).join(' · ')+
`\n${lang=='zh'?'重点提升':'Focus'}: ${p.focus.join(', ')}`;
const done=()=>{btn.textContent=t.copied;setTimeout(()=>btn.textContent=t.copy,1500);};
const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
try{document.execCommand('copy')}catch(e){}ta.remove();done();};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fallback);else fallback();}
function dlMD(){const b=new Blob([mdReport()],{type:'text/markdown'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`thinking-assessment-${R.date}.md`;a.click();}
function cmpJSON(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
rd.onload=()=>{try{const o=JSON.parse(rd.result);const t=T[lang];
$('cmp').innerHTML=`<h2>${t.delta} (${o.date})</h2><table><tr><th></th>${t.dims.map(d=>`<th>${d}</th>`).join('')}</tr>
<tr><td>${t.delta}</td>${R.dims.map((v,i)=>{const d=v-(o.dims[i]||0);return `<td class="${d>0?'good':d<0?'bad':''}">${d>0?'+':''}${d}</td>`;}).join('')}</tr></table>`;
}catch(e){alert('Invalid JSON');}};rd.readAsText(f);}
/* ---------- nav & init ---------- */
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k)setPath(S,k,e.target.value);});
function go(d){if(d>0){
if(si==3&&S.a3.some(x=>!String(x.est).trim())){alert(lang=='zh'?'请填写两道概率题的百分比再进入下一步。':'Please fill in both probability answers before continuing.');return;}
if(si==5&&!S.b.every(v=>v>0)){alert(lang=='zh'?'请完成全部 16 题自评（1–5 分）再继续。':'Please complete all 16 self-ratings before continuing.');return;}
if(si==6&&!S.c.r.every(v=>v>=0)){alert(lang=='zh'?'请为全部 7 个维度选择等级后再提交。':'Please rate all 7 dimensions before submitting.');return;}
grade();}
if(d>0&&si==7){if(confirm(lang=='zh'?'重新开始将清空当前作答。继续？':'Restart will clear current answers. Continue?')){location.reload();}return;}
si=Math.max(0,Math.min(7,si+d));window.scrollTo(0,0);render();}
$('lzh').className=lang=='zh'?'on':'';$('len').className=lang=='en'?'on':'';render();
</script>
